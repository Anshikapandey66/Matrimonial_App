<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile Photo - MilanMatch</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .photo-card {
      max-width: 500px;
      margin: 50px auto;
      padding: 35px;
      background: white;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .photo-card h1 {
      color: #8e2457;
      margin-bottom: 25px;
    }

    .preview {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      background: #f3eef1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-card input {
      width: 100%;
      margin: 15px 0;
    }

    .photo-card button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #8e2457;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="photo-card">

    <h1>📷 Profile Photo</h1>

    <div class="preview" id="preview">
      No Photo
    </div>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <button id="savePhoto">
      Save Profile Photo
    </button>

    <p id="message"></p>

  </div>

  <script>

    const input =
      document.getElementById("photoInput");

    const preview =
      document.getElementById("preview");

    const message =
      document.getElementById("message");

    const savedPhoto =
      localStorage.getItem("profilePhoto");

    if (savedPhoto) {
      preview.innerHTML =
        `<img src="${savedPhoto}" alt="Profile Photo">`;
    }

    input.addEventListener("change", function() {

      const file = input.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(event) {

        preview.innerHTML =
          `<img src="${event.target.result}" alt="Profile Photo">`;

      };

      reader.readAsDataURL(file);
    });

    document
      .getElementById("savePhoto")
      .addEventListener("click", function() {

        const file = input.files[0];

        if (!file) {
          message.textContent =
            "Please select a photo first.";
          return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {

          localStorage.setItem(
            "profilePhoto",
            event.target.result
          );

          message.textContent =
            "Profile photo saved successfully ❤️";
        };

        reader.readAsDataURL(file);
      });

  </script>

</body>
</html>
