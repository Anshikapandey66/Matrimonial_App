<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Match Preferences - MilanMatch</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .preferences-card {
      max-width: 550px;
      margin: 50px auto;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .preferences-card h1 {
      color: #8e2457;
      margin-bottom: 25px;
      text-align: center;
    }

    .preferences-card input,
    .preferences-card select {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      background: white;
    }

    .preferences-card button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #8e2457;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="preferences-card">

    <h1>❤️ Match Preferences</h1>

    <form id="preferencesForm">

      <input
        type="number"
        id="minAge"
        placeholder="Minimum Age"
        min="18"
        max="80"
        required
      >

      <input
        type="number"
        id="maxAge"
        placeholder="Maximum Age"
        min="18"
        max="80"
        required
      >

      <input
        type="text"
        id="city"
        placeholder="Preferred City"
      >

      <select id="profession">
        <option value="">Any Profession</option>
        <option value="Software Engineer">
          Software Engineer
        </option>
        <option value="Doctor">Doctor</option>
        <option value="Teacher">Teacher</option>
        <option value="Business Owner">
          Business Owner
        </option>
        <option value="Designer">Designer</option>
      </select>

      <select id="education">
        <option value="">Any Education</option>
        <option value="Graduate">Graduate</option>
        <option value="Post Graduate">
          Post Graduate
        </option>
        <option value="Doctorate">Doctorate</option>
      </select>

      <button type="submit">
        Save Preferences
      </button>

    </form>

    <p id="message"></p>

  </div>

  <script>
    const form =
      document.getElementById("preferencesForm");

    const savedPreferences =
      JSON.parse(
        localStorage.getItem("matchPreferences")
      );

    if (savedPreferences) {
      document.getElementById("minAge").value =
        savedPreferences.minAge || "";

      document.getElementById("maxAge").value =
        savedPreferences.maxAge || "";

      document.getElementById("city").value =
        savedPreferences.city || "";

      document.getElementById("profession").value =
        savedPreferences.profession || "";

      document.getElementById("education").value =
        savedPreferences.education || "";
    }

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const preferences = {
        minAge:
          document.getElementById("minAge").value,

        maxAge:
          document.getElementById("maxAge").value,

        city:
          document.getElementById("city").value,

        profession:
          document.getElementById("profession").value,

        education:
          document.getElementById("education").value
      };

      localStorage.setItem(
        "matchPreferences",
        JSON.stringify(preferences)
      );

      document.getElementById("message").textContent =
        "Preferences saved successfully ❤️";
    });
  </script>

</body>
</html>
